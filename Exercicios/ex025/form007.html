<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form007</title>
</head>

<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get">

        <p>
            <label for="iest">Estado</label>
            <select name="est" id="iest">
                <optgroup label="Região 1">
                    <option value="sp" selected>São Paulo</option>
                    <option value="rj">Rio de Janeiro</option>
                </optgroup>
                <optgroup label="Região 2">
                    <option value="ma">Maranhão</option>
                    <option value="pa">Pará</option>
                    <option value="mu">Meu Cu</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="iprof">Profissão</label>
            <input type="text" name="prof" id="iprof" list="ltprof">
            <datalist id="ltprof">
                <option value="mec">mecanico</option>
                <option value="pros">prostituta</option>
                <option value="dent">dentista</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem</label>
            <textarea name="msg" id="imsg" cols="40" rows="5"></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
